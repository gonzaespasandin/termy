# Termy - nginx site configuration (single domain: SPA + Laravel API).
#
# Install: copy to /etc/nginx/sites-available/termy, symlink into sites-enabled.
# HTTP only on purpose: `certbot --nginx` adds the TLS listener, the certificate
# paths and the HTTP -> HTTPS redirect by rewriting this file.
# Replace server_name below with the real domain before running certbot.

server {
    listen 80;
    listen [::]:80;

    # TODO: replace with the real domain (certbot reads this value).
    server_name turnos.example.com;

    root /var/www/termy/frontend/dist;
    index index.html;

    # Display videos are up to 50 MB; keep in sync with php.ini (see deploy/README.md).
    client_max_body_size 60M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Never expose dotfiles (.env, .git, ...).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Laravel API. Routes already carry the /api prefix, so the full URI is
    # passed through to the front controller.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/termy/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # SSE streams can stay open up to 1 hour; Laravel also sends X-Accel-Buffering: no.
        fastcgi_buffering off;
        fastcgi_read_timeout 3700s;
    }

    # Laravel health check.
    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/termy/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Uploaded files (symlink created by `php artisan storage:link`).
    location /storage/ {
        alias /var/www/termy/backend/public/storage/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (vue-router history mode). Keep index.html uncached.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
