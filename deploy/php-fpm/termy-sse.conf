; Dedicated PHP-FPM pool for the SSE streams (/api/sse/*).
;
; Every display and operator stream pins one worker for up to an hour, so these
; connections must not share a pool with regular API requests (POST /turns, login,
; operator actions). Otherwise a handful of open screens exhausts the default pool
; (pm.max_children = 5 on Ubuntu) and totems can no longer issue tickets.
;
; Sizing: pm.max_children >= displays + operator stations + a safety margin.
; Each worker needs roughly 30-40 MB of RAM; measure with:
;   ps --no-headers -o rss -C php-fpm8.3 | awk '{s+=$1} END {print s/1024 " MB"}'
;
; Install: sudo cp deploy/php-fpm/termy-sse.conf /etc/php/8.3/fpm/pool.d/termy-sse.conf
;          sudo systemctl reload php8.3-fpm

[termy-sse]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-sse.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
